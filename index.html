<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Three.js Quad Viewer</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4caf50;
            --border-color: #333;
            --header-height: 50px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: #000;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 18px; margin: 0; }

        .global-controls button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .global-controls button:hover { background-color: #1976D2; }

        /* Main Grid */
        #main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            background-color: var(--border-color);
            position: relative;
        }

        /* Individual Panel */
        .panel {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
            min-height: 0;
        }

        /* Fullscreen Mode for a single panel */
        .panel.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 8px;
            padding: 6px;
            background-color: #252526;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .toolbar button {
            background-color: #333;
            color: #ddd;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .toolbar button:hover { background-color: #444; }
        .toolbar button.btn-run { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }
        .toolbar button.btn-run:hover { background-color: #45a049; }

        /* Split View (Editor vs Preview) */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: row;
            height: 100%;
            overflow: hidden;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            min-width: 0; 
        }

        textarea {
            flex: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            white-space: pre;
        }

        .preview-container {
            flex: 1;
            background-color: #000;
            position: relative;
            min-width: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Quad Animation Mode (Hide Editors) */
        body.mode-quad-anim .editor-container {
            display: none !important;
        }
        body.mode-quad-anim .toolbar {
            display: none !important;
        }
        /* Button to exit quad mode */
        #exit-quad-btn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            background-color: rgba(255, 68, 68, 0.9);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

    </style>
</head>
<body>

<header>
    <h1>WebXR(VR) Code Viewer (3 Pro Generator)</h1>
    <div class="global-controls">
        <button id="toggle-quad-view">WebXR Quad View (Anim Only)</button>
    </div>
</header>

<div id="main-container">
    </div>

<button id="exit-quad-btn">Exit Quad View</button>

<script>
    const container = document.getElementById('main-container');
    const exitQuadBtn = document.getElementById('exit-quad-btn');
    const toggleQuadBtn = document.getElementById('toggle-quad-view');

    // 4つのパネルを生成
    for (let i = 0; i < 4; i++) {
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.id = `panel-${i}`;
        panel.innerHTML = `
            <div class="toolbar">
                <span style="font-size:12px; color:#888; margin-right:auto;">ID: ${i+1}</span>
                <button class="btn-run" onclick="runCode(${i})">▶ 実行</button>
                <button onclick="pasteCode(${i})">📋 ペースト</button>
                <button onclick="copyCode(${i})">📑 コピー</button>
                <button onclick="toggleFullscreen(${i})">⛶ 最大化</button>
            </div>
            <div class="workspace">
                <div class="editor-container">
                    <textarea id="code-${i}" placeholder="// ここに生成されたコードを貼り付けてください..."></textarea>
                </div>
                <div class="preview-container">
                    <iframe id="frame-${i}"></iframe>
                </div>
            </div>
        `;
        container.appendChild(panel);
    }

    // --- Actions ---

    function runCode(index) {
        const code = document.getElementById(`code-${index}`).value;
        const frame = document.getElementById(`frame-${index}`);
        
        // Iframeの中身を生成
        const htmlContent = createIframeContent(code);
        frame.srcdoc = htmlContent;
    }

    async function pasteCode(index) {
        try {
            const text = await navigator.clipboard.readText();
            const textarea = document.getElementById(`code-${index}`);
            textarea.value = text;
            // 自動的に実行する場合はコメントアウトを外す
            // runCode(index); 
        } catch (err) {
            alert('クリップボードからの読み込みに失敗しました。権限を確認するか、Ctrl+Vを使用してください。');
        }
    }

    function copyCode(index) {
        const textarea = document.getElementById(`code-${index}`);
        textarea.select();
        document.execCommand('copy'); // Fallback for older browsers
        // Modern API fallback
        if (navigator.clipboard) {
            navigator.clipboard.writeText(textarea.value).then(() => {
                // Success feedback if needed
            });
        }
    }

    function toggleFullscreen(index) {
        const panel = document.getElementById(`panel-${index}`);
        panel.classList.toggle('fullscreen');
    }

    // --- Global View Mode ---

    toggleQuadBtn.addEventListener('click', () => {
        document.body.classList.add('mode-quad-anim');
        exitQuadBtn.style.display = 'block';
    });

    exitQuadBtn.addEventListener('click', () => {
        document.body.classList.remove('mode-quad-anim');
        exitQuadBtn.style.display = 'none';
    });

    // --- Iframe Template Generator ---

    function createIframeContent(userCode) {
        return `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { margin: 0; overflow: hidden; background: #000; }
                    canvas { width: 100% !important; height: 100% !important; display: block; }
                </style>
            </head>
            <body>
                <script type="module">
                    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

                    // --- Setup Boilerplate ---
                    const scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x111111);
                    // Fog to blend floor
                    scene.fog = new THREE.Fog(0x111111, 2, 20);

                    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
                    // User starts at 1.6m height
                    camera.position.set(0, 1.6, 0);

                    const renderer = new THREE.WebGLRenderer({ antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.shadowMap.enabled = true;
                    renderer.xr.enabled = true; // VR Ready logic
                    document.body.appendChild(renderer.domElement);

                    // --- Default Environment (Lights & Floor) ---
                    // ユーザーがライトを忘れても見えるように最低限の環境光
                    const ambientLight = new THREE.AmbientLight(0x404040, 2); 
                    scene.add(ambientLight);

                    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
                    dirLight.position.set(5, 10, 7);
                    dirLight.castShadow = true;
                    scene.add(dirLight);

                    // Grid helper for context
                    const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
                    scene.add(gridHelper);

                    // Floor to receive shadows
                    const floorGeo = new THREE.PlaneGeometry(20, 20);
                    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
                    const floor = new THREE.Mesh(floorGeo, floorMat);
                    floor.rotation.x = -Math.PI / 2;
                    floor.receiveShadow = true;
                    scene.add(floor);

                    // Window Resize Handle
                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    // --- Variable Exposure for User Code ---
                    // Module scope variables need to be explicitly available if user code relies on specific scope behavior,
                    // but since we are injecting code below, they are naturally available in this block.

                    // Placeholder for user's update function
                    let userUpdate = null;

                    // --- User Code Injection ---
                    try {
                        // Wrapping user code to handle "function update()" definition safely
                        // Using Function constructor or eval is risky in production but standard for code playgrounds.
                        // Here we just insert the string directly into the module script via template literal works best for scope sharing.
                    } catch (e) {
                        console.error("Setup Error:", e);
                    }

                    // *** INJECTED USER CODE START ***
                    ${userCode}
                    // *** INJECTED USER CODE END ***

                    // Check if 'update' function exists from user code
                    if (typeof update === 'function') {
                        userUpdate = update;
                    }

                    // --- Animation Loop ---
                    const clock = new THREE.Clock();
                    renderer.setAnimationLoop(() => {
                        const time = clock.getElapsedTime();
                        
                        if (userUpdate) {
                            try {
                                userUpdate(time);
                            } catch(e) {
                                // Prevent crashing loop on error
                            }
                        }
                        
                        renderer.render(scene, camera);
                    });
                <\/script>
            </body>
            </html>
        `;
    }
</script>

</body>
</html>
