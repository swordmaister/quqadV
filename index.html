<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Quad Viewer (v5: Robust)</title>
    <style>
        :root {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0;
            --accent-color: #4caf50; --warn-color: #ff9800; --border-color: #333;
        }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #000; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 16px; margin: 0; }
        
        #main-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; background: var(--border-color); }
        .panel { background: var(--panel-bg); display: flex; flex-direction: column; position: relative; min-width: 0; min-height: 0; }
        .panel.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; }
        
        .toolbar { display: flex; gap: 6px; padding: 6px; background: #252526; border-bottom: 1px solid var(--border-color); }
        .toolbar button { background: #333; color: #ddd; border: 1px solid #444; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .toolbar button:hover { background: #444; }
        .toolbar button.btn-run { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .toolbar button.btn-cam.active { background: var(--warn-color); color: #000; font-weight: bold; }
        
        .workspace { flex: 1; display: flex; height: 100%; }
        .editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; font-family: monospace; font-size: 12px; resize: none; outline: none; }
        .preview-container { flex: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        body.mode-quad-anim .editor-container, body.mode-quad-anim .toolbar { display: none !important; }
        #exit-quad-btn { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 2000; background: #d32f2f; color: white; padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; }
        #toggle-quad-view { background: #2196F3; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>WebXR Quad Viewer (v5)</h1>
    <button id="toggle-quad-view">WebXR Quad View</button>
</header>

<div id="main-container"></div>
<button id="exit-quad-btn">Exit Quad View</button>

<script>
    const container = document.getElementById('main-container');
    
    // 4画面生成
    for (let i = 0; i < 4; i++) {
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.id = `panel-${i}`;
        panel.innerHTML = `
            <div class="toolbar">
                <span style="color:#666; font-size:10px; margin-right:auto; align-self:center;">#${i+1}</span>
                <button class="btn-run" onclick="runCode(${i})">▶ 実行</button>
                <button onclick="pasteCode(${i})">📋 ペースト</button>
                <button onclick="copyCode(${i})">📑 コピー</button>
                <button id="btn-cam-${i}" class="btn-cam" onclick="toggleCamera(${i})">📷 自由視点: OFF</button>
                <button onclick="toggleFullscreen(${i})">⛶ 最大化</button>
            </div>
            <div class="workspace">
                <div class="editor-container">
                    <textarea id="code-${i}" placeholder="// ここにコードをペースト"></textarea>
                </div>
                <div class="preview-container">
                    <iframe id="frame-${i}"></iframe>
                </div>
            </div>
        `;
        container.appendChild(panel);
    }

    // --- 機能実装 ---

    function runCode(index) {
        const textarea = document.getElementById(`code-${index}`);
        const frame = document.getElementById(`frame-${index}`);
        const rawCode = textarea.value;
        const safeCode = rawCode.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
        
        // 自由カメラボタンのリセット
        const btn = document.getElementById(`btn-cam-${index}`);
        btn.classList.remove('active');
        btn.innerText = "📷 自由視点: OFF";
        
        frame.srcdoc = createIframeContent(safeCode);
    }

    async function pasteCode(index) {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById(`code-${index}`).value = text;
        } catch (e) { alert('クリップボード操作が許可されていません'); }
    }

    function copyCode(index) {
        const t = document.getElementById(`code-${index}`);
        t.select(); document.execCommand('copy');
        if(navigator.clipboard) navigator.clipboard.writeText(t.value);
    }

    function toggleFullscreen(index) { document.getElementById(`panel-${index}`).classList.toggle('fullscreen'); }

    function toggleCamera(index) {
        const frame = document.getElementById(`frame-${index}`);
        const btn = document.getElementById(`btn-cam-${index}`);
        const isActive = btn.classList.contains('active');
        
        if (frame.contentWindow) {
            frame.contentWindow.postMessage({ type: 'toggle-camera', value: !isActive }, '*');
            if (!isActive) {
                btn.classList.add('active');
                btn.innerText = "📷 自由視点: ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = "📷 自由視点: OFF";
            }
        }
    }

    // Quad View Toggle
    document.getElementById('toggle-quad-view').onclick = () => {
        document.body.classList.add('mode-quad-anim');
        document.getElementById('exit-quad-btn').style.display = 'block';
    };
    document.getElementById('exit-quad-btn').onclick = () => {
        document.body.classList.remove('mode-quad-anim');
        document.getElementById('exit-quad-btn').style.display = 'none';
    };

    // --- Iframeの中身（修正版） ---
    function createIframeContent(userCode) {
        return `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { margin: 0; overflow: hidden; background: #000; }
                    canvas { width: 100% !important; height: 100% !important; display: block; }
                    #msg { position: absolute; top: 0; left: 0; background: rgba(200,0,0,0.8); color: white; padding: 5px; font-size: 11px; display: none; }
                </style>
            </head>
            <body>
                <div id="msg"></div>
                <script type="importmap">
                    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
                <\/script>
                <script type="module">
                    import * as THREE from 'three';
                    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

                    window.onerror = (m) => { const e = document.getElementById('msg'); e.style.display='block'; e.innerText='Error: '+m; };

                    const scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x111111);
                    scene.fog = new THREE.Fog(0x111111, 2, 50);

                    const userCamera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
                    userCamera.position.set(0, 1.6, 0);

                    const freeCamera = userCamera.clone();
                    
                    const renderer = new THREE.WebGLRenderer({ antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.shadowMap.enabled = true;
                    renderer.xr.enabled = true;
                    document.body.appendChild(renderer.domElement);

                    const controls = new OrbitControls(freeCamera, renderer.domElement);
                    controls.target.set(0, 1.6, -5);
                    controls.enableDamping = true;
                    controls.enabled = false;

                    scene.add(new THREE.AmbientLight(0x404040, 2));
                    const dl = new THREE.DirectionalLight(0xffffff, 2);
                    dl.position.set(5, 10, 7); dl.castShadow = true; scene.add(dl);
                    scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));
                    const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.MeshStandardMaterial({color:0x222222}));
                    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

                    const realRender = renderer.render.bind(renderer);
                    let isFreeCam = false;
                    let userRenderCalled = false;

                    renderer.render = function(scene, camera) {
                        userRenderCalled = true;
                        if (isFreeCam) {
                            controls.update();
                            realRender(scene, freeCamera);
                        } else {
                            realRender(scene, camera);
                        }
                    };

                    const realSetAnimLoop = renderer.setAnimationLoop.bind(renderer);
                    let userLoopActive = false;
                    
                    renderer.setAnimationLoop = function(callback) {
                        userLoopActive = !!callback;
                        realSetAnimLoop(callback);
                    };

                    window.THREE = THREE;
                    window.scene = scene;
                    window.camera = userCamera;
                    window.renderer = renderer;

                    // ★ ユーザーコードを実行
                    try {
                        ${userCode}
                    } catch(e) { 
                        console.error(e); 
                        document.getElementById('msg').innerText = e.message; 
                        document.getElementById('msg').style.display='block'; 
                    }

                    // ★ フォールバックループ (ユーザーコード実行後に判定)
                    setTimeout(() => {
                        if (!userLoopActive) {
                            const clock = new THREE.Clock();
                            
                            renderer.setAnimationLoop(() => {
                                const time = clock.getElapsedTime();
                                
                                // グローバルスコープの update 関数を探す
                                if (typeof window.update === 'function') {
                                    try { 
                                        window.update(time); 
                                    } catch(e) {
                                        console.error('Update error:', e);
                                    }
                                }
                                
                                // ユーザーが render を呼んでいない場合のみ描画
                                if (!userRenderCalled) {
                                    renderer.render(scene, userCamera);
                                }
                                userRenderCalled = false; // 次フレーム用にリセット
                            });
                        }
                    }, 100); // ユーザーコードの初期化を待つ

                    window.addEventListener('message', (e) => {
                        if (e.data.type === 'toggle-camera') {
                            isFreeCam = e.data.value;
                            controls.enabled = isFreeCam;
                            if (isFreeCam) {
                                freeCamera.position.copy(userCamera.position);
                                freeCamera.rotation.copy(userCamera.rotation);
                                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(userCamera.quaternion);
                                controls.target.copy(userCamera.position).add(forward.multiplyScalar(5));
                            }
                        }
                    });
                    
                    window.onresize = () => {
                        userCamera.aspect = freeCamera.aspect = window.innerWidth/window.innerHeight;
                        userCamera.updateProjectionMatrix(); freeCamera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    };
                <\/script>
            </body>
            </html>
        `;
    }
</script>
</body>
</html>
