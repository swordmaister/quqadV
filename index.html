<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Three.js Quad Viewer (v2)</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4caf50;
            --border-color: #333;
            --header-height: 50px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: #000;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 18px; margin: 0; }

        .global-controls button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .global-controls button:hover { background-color: #1976D2; }

        #main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            background-color: var(--border-color);
        }

        .panel {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
            min-height: 0;
        }

        .panel.fullscreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1000;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 6px;
            background-color: #252526;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .toolbar button {
            background-color: #333;
            color: #ddd;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .toolbar button:hover { background-color: #444; }
        .toolbar button.btn-run { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }
        .toolbar button.btn-run:hover { background-color: #45a049; }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: row;
            height: 100%;
            overflow: hidden;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            min-width: 0; 
        }

        textarea {
            flex: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            white-space: pre;
        }

        .preview-container {
            flex: 1;
            background-color: #000;
            position: relative;
            min-width: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        body.mode-quad-anim .editor-container, 
        body.mode-quad-anim .toolbar { display: none !important; }
        
        #exit-quad-btn {
            display: none;
            position: fixed; bottom: 20px; right: 20px; z-index: 2000;
            background-color: rgba(255, 68, 68, 0.9);
            color: white; padding: 10px 20px; border: none; border-radius: 20px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<header>
    <h1>WebXR Quad Viewer (Fix v2)</h1>
    <div class="global-controls">
        <button id="toggle-quad-view">WebXR Quad View (Anim Only)</button>
    </div>
</header>

<div id="main-container"></div>
<button id="exit-quad-btn">Exit Quad View</button>

<script>
    const container = document.getElementById('main-container');
    const exitQuadBtn = document.getElementById('exit-quad-btn');
    const toggleQuadBtn = document.getElementById('toggle-quad-view');

    // パネル生成
    for (let i = 0; i < 4; i++) {
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.id = `panel-${i}`;
        panel.innerHTML = `
            <div class="toolbar">
                <span style="font-size:12px; color:#888; margin-right:auto;">ID: ${i+1}</span>
                <button class="btn-run" onclick="runCode(${i})">▶ 実行</button>
                <button onclick="pasteCode(${i})">📋 ペースト</button>
                <button onclick="copyCode(${i})">📑 コピー</button>
                <button onclick="toggleFullscreen(${i})">⛶ 最大化</button>
            </div>
            <div class="workspace">
                <div class="editor-container">
                    <textarea id="code-${i}" placeholder="// ここにコードをペーストしてください..."></textarea>
                </div>
                <div class="preview-container">
                    <iframe id="frame-${i}"></iframe>
                </div>
            </div>
        `;
        container.appendChild(panel);
    }

    function runCode(index) {
        const textarea = document.getElementById(`code-${index}`);
        const frame = document.getElementById(`frame-${index}`);
        // ユーザーコード内のバッククォートをエスケープしてテンプレートリテラルの破損を防ぐ
        const rawCode = textarea.value;
        const safeCode = rawCode.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
        
        frame.srcdoc = createIframeContent(safeCode);
    }

    async function pasteCode(index) {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById(`code-${index}`).value = text;
        } catch (err) {
            alert('ペースト権限がありません。Ctrl+Vを使用してください。');
        }
    }

    function copyCode(index) {
        const textarea = document.getElementById(`code-${index}`);
        textarea.select();
        document.execCommand('copy');
        if (navigator.clipboard) navigator.clipboard.writeText(textarea.value);
    }

    function toggleFullscreen(index) {
        document.getElementById(`panel-${index}`).classList.toggle('fullscreen');
    }

    toggleQuadBtn.addEventListener('click', () => {
        document.body.classList.add('mode-quad-anim');
        exitQuadBtn.style.display = 'block';
    });

    exitQuadBtn.addEventListener('click', () => {
        document.body.classList.remove('mode-quad-anim');
        exitQuadBtn.style.display = 'none';
    });

    function createIframeContent(userCode) {
        return `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { margin: 0; overflow: hidden; background: #000; }
                    canvas { width: 100% !important; height: 100% !important; display: block; }
                    #error-msg {
                        position: absolute; top: 0; left: 0; width: 100%;
                        background: rgba(255,0,0,0.8); color: white; padding: 10px;
                        font-family: monospace; font-size: 12px; display: none; z-index: 9999;
                        white-space: pre-wrap;
                    }
                </style>
            </head>
            <body>
                <div id="error-msg"></div>
                <script type="module">
                    // エラーハンドリング
                    window.onerror = function(message, source, lineno, colno, error) {
                        const el = document.getElementById('error-msg');
                        el.style.display = 'block';
                        el.innerText = 'Error: ' + message;
                    };

                    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

                    // 基本設定
                    const scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x111111);
                    scene.fog = new THREE.Fog(0x111111, 2, 25); // 奥行き感を出すフォグ

                    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
                    camera.position.set(0, 1.6, 0);

                    const renderer = new THREE.WebGLRenderer({ antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.shadowMap.enabled = true;
                    renderer.xr.enabled = true;
                    document.body.appendChild(renderer.domElement);

                    // ライトと床 (ユーザーが定義しなくても見えるように)
                    const ambientLight = new THREE.AmbientLight(0x404040, 2); 
                    scene.add(ambientLight);

                    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
                    dirLight.position.set(5, 10, 7);
                    dirLight.castShadow = true;
                    scene.add(dirLight);

                    const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
                    scene.add(grid);
                    
                    const floor = new THREE.Mesh(
                        new THREE.PlaneGeometry(20, 20),
                        new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 })
                    );
                    floor.rotation.x = -Math.PI / 2;
                    floor.receiveShadow = true;
                    scene.add(floor);

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    // ユーザー定義のupdate関数を保持する変数
                    let userUpdate = null;

                    // --- ユーザーコード注入 ---
                    try {
                        // ユーザーコード実行ブロック
                        // scene, camera, renderer, THREE はこのスコープで利用可能
                        ${userCode}

                        // update関数が存在するかチェック
                        if (typeof update === 'function') {
                            userUpdate = update;
                        } else {
                            console.log("No 'update(time)' function found in user code.");
                        }
                    } catch (e) {
                        const el = document.getElementById('error-msg');
                        el.style.display = 'block';
                        el.innerText = 'Script Error: ' + e.message + '\\n(変数の再定義などを確認してください)';
                        console.error(e);
                        throw e; 
                    }

                    // --- アニメーションループ ---
                    const clock = new THREE.Clock();
                    
                    renderer.setAnimationLoop(() => {
                        const time = clock.getElapsedTime();
                        
                        // ユーザーのアニメーション関数を実行
                        if (userUpdate) {
                            try {
                                userUpdate(time);
                            } catch(e) {
                                // ループ内でエラーが出たら停止せずログだけ出す(頻繁に出るので注意)
                                console.error(e);
                            }
                        }
                        
                        renderer.render(scene, camera);
                    });
                <\/script>
            </body>
            </html>
        `;
    }
</script>
</body>
</html>
